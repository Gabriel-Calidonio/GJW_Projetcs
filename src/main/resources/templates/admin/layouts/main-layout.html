<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Painel Administrativo - GWJ</title>
    <!-- 1. CSS de uso geral (carrega primeiro) -->
    <link rel="stylesheet" th:href="@{/css/styles-admin.css}">
    
    <!-- Chama o CSS do header aqui no HEAD -->
    <th:block th:replace="~{admin/fragments/header :: header-css}"></th:block>
    
    <!-- Ícones do Bootstrap (para a Sidebar) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <!-- Chama o HTML do header aqui no BODY -->
    <div th:replace="~{admin/fragments/header :: header}"></div>
        
    <div class="gwj-content-wrapper"> 

        <!-- Chama o fragmento da Sidebar -->
        <th:block th:replace="~{admin/fragments/sidebar :: sidebar}"></th:block>

        <!-- Área principal onde o conteúdo será injetado pelo Thymeleaf -->
        <main class="gwj-main-content">
            <th:block th:replace="${content}"></th:block>
        </main>
    </div>
</body>
</html>
