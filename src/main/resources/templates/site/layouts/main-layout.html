<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, extraHead, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Tgo's Barbearia</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <th:block th:if="${extraHead != null}"><th:block th:replace="${extraHead}"></th:block></th:block>
</head>
<body>
    
    <!-- Substitui o antigo PHP include para inserir o header completo -->
    <div th:insert="~{site/fragments/header :: header}"></div>
        
    <th:block th:replace="${content}"></th:block>

    <!-- Substitui o antigo PHP include para inserir o footer completo -->
    <div th:insert="~{site/fragments/footer :: footer}"></div>
</body>
</html>
