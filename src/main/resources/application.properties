spring.application.name=sistemas

server.port=${SERVER_PORT:8089}

# Suporte a Proxy Reverso HTTPS (Cloudflare / Nginx: X-Forwarded-Proto, X-Forwarded-For)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# URL de conexão (Ex: jdbc:mysql://localhost:3306/nome_banco):
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/gwj2?allowPublicKeyRetrieval=true&useSSL=false}

# Usuário do banco
spring.datasource.username=${DB_USERNAME:desenvolvedor}

# Senha do banco (Lida via variável de ambiente DB_PASSWORD ou arquivo .env)
spring.datasource.password=${DB_PASSWORD:}

# Driver do banco
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Prefixo das tabelas do banco de dados
app.database.prefix=${APP_DB_PREFIX:tab_}

# Rota ofuscada do Painel Administrativo
admin.route.prefix=${ADMIN_ROUTE_PREFIX:MRYnZpAsC9sp}

# Configuração para identificação dinâmica de entidades nos templates
app.entity.package=${APP_ENTITY_PACKAGE:com.gwj.model.domain}
app.entities.path=${APP_ENTITIES_PATH:com.gwj.model.domain.entities}